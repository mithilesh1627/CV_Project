{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/contact.css') }}">

<section class="contact-section">
  <div class="form-container">
    <h2>Contact Me</h2>

    <!-- Toast Message -->
    <div id="toast" class="toast success-toast">
  Thank you! Your message has been sent.
</div>

    <!-- Flash Errors -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-message">
          {% for message in messages %}
            <p> {{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" action="/contact" id="contact-form">
      <div class="form-group">
        <input required type="text" id="name" name="name" placeholder=" " pattern="[A-Za-z ]{2,}">
        <label for="name">Name</label>
      </div>

      <div class="form-group">
         <input required type="email" id="email" name="email" placeholder=" ">
        <label for="email">Email</label>
      </div>

      <div class="form-group">
        <textarea required id="message" name="message" rows="5" placeholder=" "></textarea>
        <label for="message">Message</label>
      </div>

      <!-- reCAPTCHA -->
      <div class="g-recaptcha" data-sitekey="{{ recaptcha_site_key }}"></div>
      <br>

      <button type="submit" class="submit-btn">Send Message</button>
    </form>
  </div>

  <div class="contact-info">
    <h3>Get in Touch</h3>
    <div class="social-links">
      <a href="mailto:mithileshchaurasiya1627@gmail.com"><i class="fas fa-envelope"></i></a>
      <a href="https://github.com/mithilesh1627" target="_blank"><i class="fab fa-github"></i></a>
      <a href="https://linkedin.com/in/mithilesh1627" target="_blank"><i class="fab fa-linkedin"></i></a>
    </div>
  </div>
</section>

<script src="https://www.google.com/recaptcha/api.js" async defer></script>

<!-- JS Validation -->
<script>
document.getElementById("contact-form").addEventListener("submit", function(e) {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const message = document.getElementById("message").value.trim();

  const namePattern = /^[A-Za-z ]{2,}$/;
  const emailPattern = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

  if (!namePattern.test(name)) {
    alert("Please enter a valid name (only letters and spaces).");
    e.preventDefault();
    return;
  }

  if (!emailPattern.test(email)) {
    alert("Please enter a valid email address.");
    e.preventDefault();
    return;
  }

  if (message.length < 5) {
    alert("Please enter a message with at least 5 characters.");
    e.preventDefault();
    return;
  }
});
</script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const form = document.getElementById('contact-form');

    if (form) {
      form.addEventListener('submit', function () {
        // Show toast immediately on click
        showToast("⏳ Submitting your message...");

        // Toast disappears after 3 seconds
        setTimeout(() => {
          hideToast();
        }, 3000);
      });
    }

    // Show success toast if server rendered it
    {% if success %}
    showToast(" Message sent successfully! Please check your inbox/spam folder");
    setTimeout(() => {
      hideToast();
    }, 4000);
    {% endif %}
  });

  function showToast(message) {
    let toast = document.createElement("div");
    toast.className = "toast show";
    toast.innerText = message;
    document.body.appendChild(toast);
  }

  function hideToast() {
    const toast = document.querySelector(".toast");
    if (toast) {
      toast.classList.remove("show");
      setTimeout(() => toast.remove(), 300);
    }
  }
</script>

{% endblock %}
