{% extends "base.html" %}

{% block content %}
<section class="error-page" style="min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem;">
    <div style="font-size: 5rem; color: var(--accent); margin-bottom: 1rem;">
        <i class="fas fa-triangle-exclamation"></i>
    </div>
    <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">404 — Page Not Found</h1>
    <p style="color: var(--text-muted); max-width: 500px; margin-bottom: 2rem;">
        The resource or page you are requesting could not be located. It may have been moved, renamed, or temporarily archived.
    </p>
    <div style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center;">
        <a href="/" class="btn btn-primary"><i class="fas fa-house"></i> Return Home</a>
        <a href="/projects_certifications" class="btn btn-secondary"><i class="fas fa-cubes"></i> View Projects</a>
    </div>
</section>
{% endblock %}
