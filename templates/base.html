</head>
<body>
<header>
  <nav>
      <a href="/" class="{% if request.path == '/' %}active{% endif %}">Home</a>
      <a href="/academic_technical" class="{% if request.path == '/academic_technical' %}active{% endif %}">Academic & Technical</a>
      <a href="/projects_certifications" class="{% if request.path == '/projects_certifications' %}active{% endif %}">Projects & Certifications</a>
      <a href="/contact" class="{% if request.path == '/contact' %}active{% endif %}">Contact</a>

           </label>
      </div>
  </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    <p>© {{ 2025 }} Mithilesh Chaurasiya | Made with Flask </p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script>
  AOS.init({ duration: 1000, once: true });
</script>

<script>
  const phrases = [
    "Hello, I’m <span class='highlight'>Mithilesh Chaurasiya</span>.",
    "<span class='highlight'>ML Developer </span>|<span class='highlight'> Data Engineer </span>",
    "Solving real-world problems through <span class='highlight'>AI & Data</span>.",
    "Driven by <span class='highlight'>curiosity</span>, <span class='highlight'>structure</span>, and continuous learning.",
    "I love <span class='highlight'>Travelling</span> and <span class='highlight'>Photography</span>."
  ];

  let currentPhrase = 0;
  let currentChar = 0;
  let isDeleting = false;
  const typewriter = document.getElementById("typewriter-text");

  function getNextChar(phrase, index) {
    if (phrase[index] === "<") {
      // Get the full HTML tag
      const endIdx = phrase.indexOf(">", index);
      return {
        text: phrase.slice(index, endIdx + 1),
        nextIndex: endIdx + 1
      };
    }
    return {
      text: phrase[index],
      nextIndex: index + 1
    };
  }

  function type() {
    const fullPhrase = phrases[currentPhrase];
    let visible = "";
    let i = 0;
    let charCount = 0;

    while (i < fullPhrase.length && charCount < currentChar) {
      const { text, nextIndex } = getNextChar(fullPhrase, i);
      visible += text;
      if (!text.startsWith("<")) charCount++;
      i = nextIndex;
    }

    typewriter.innerHTML = visible + "<span class='cursor'>|</span>";

    if (!isDeleting && charCount < fullPhrase.replace(/<[^>]*>/g, "").length) {
      currentChar++;
      setTimeout(type, 100);
    } else if (isDeleting && currentChar > 0) {
      currentChar--;
      setTimeout(type, 50);
    } else {
      isDeleting = !isDeleting;
      if (!isDeleting) currentPhrase = (currentPhrase + 1) % phrases.length;
      setTimeout(type, isDeleting ? 1000 : 1500);
    }
  }

  document.addEventListener("DOMContentLoaded", type);
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const tabButtons = document.querySelectorAll(".tab-btn");
    const tabContents = document.querySelectorAll(".tab-content");

    tabButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        // Remove 'active' from all buttons & tabs
        tabButtons.forEach((b) => b.classList.remove("active"));
        tabContents.forEach((tab) => tab.classList.remove("active"));

        // Add 'active' to clicked button & its tab
        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
      });
    });
  });
</script>
</body>
</html>
